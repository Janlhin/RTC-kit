name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装静态检查依赖
        run: python -m pip install --quiet --upgrade pip ruff mypy vulture

      - name: 脚本基线 / 根白名单 / 冲突标记 / 文档链接 / SemVer / 格式 / Lint / 类型 / 死代码
        run: ./scripts/verify.ps1 -Fast

  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: python -m pip install --quiet --upgrade pip jsonschema coverage tzdata

      - name: 回归测试 + 覆盖率 + 安装器冒烟
        run: ./scripts/verify.ps1 -SkipStatic
