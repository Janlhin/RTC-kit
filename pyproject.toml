[project]
name = "rtc-kit"
version = "0.1.0"
description = "RTC-kit：可复用的「提醒 + 任务 + 判断」规则包与确定性脚本"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.6",
    "vulture>=2.11",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tools/one-off"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # 与项目约定冲突的规则：中文注释与文档字符串里必然出现全角标点
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["code", "install.py"]
exclude = ["code/tests"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# 已有缺口：mypy 尚未收紧到 strict（T-004）。按模块一批一批收，收完一批就把
# 该模块加进下面的 overrides；全部收完时把 `strict = true` 提到 [tool.mypy] 顶层。
[[tool.mypy.overrides]]
module = ["rtc_ics", "rtc_report"]
strict = true

[tool.coverage.run]
branch = true
parallel = true
source = ["code", "install.py"]
omit = ["code/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 2026-11-20 实测：语句 82%、分支 76%。阈值按实测基线取整到目标值（80/70），
# 分支阈值在 scripts/check-coverage.ps1 里判——coverage.py 没有分支阈值配置项。
fail_under = 80
